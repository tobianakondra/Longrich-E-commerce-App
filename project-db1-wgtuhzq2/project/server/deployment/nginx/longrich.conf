server {
    listen 80;
    server_name api.longrich.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.longrich.online;

    ssl_certificate /etc/letsencrypt/live/api.longrich.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.longrich.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # LOGIQUE DE WHITELIST (Le Bouclier reste actif)
    set $allowed_origin 0;
    if ($http_origin ~* "^https?://(longrich\.online|www\.longrich\.online|longrich-3212d\.web\.app|longrich-3212d\.firebaseapp\.com|localhost|127\.0\.0\.1)(:[0-9]+)?$") {
        set $allowed_origin 1;
    }
    if ($request_uri ~* ^/api/ipn) { set $allowed_origin 1; }
    if ($http_origin = "") { set $allowed_origin 1; }

    location / {
        # Bloquer si l'origine n'est pas autorisée
        if ($allowed_origin = 0) {
            return 403;
        }

        # On ne met PLUS de "add_header Access-Control-Allow-Origin" ici
        # car Node.js s'en occupe déjà.

        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

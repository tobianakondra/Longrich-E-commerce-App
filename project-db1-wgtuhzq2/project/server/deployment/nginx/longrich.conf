server {
    listen 80;
    server_name longrich.online www.longrich.online;
    
    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name longrich.online www.longrich.online;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/longrich.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/longrich.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logic to restrict origins (CORS security)
    set $allowed_origin 0;
    
    # Check if the request comes from an authorized domain
    if ($http_origin ~* "^https?://(longrich\.online|longrich-3212d\.web\.app|longrich-3212d\.firebaseapp\.com)$") {
        set $allowed_origin 1;
    }
    
    # Always allow webhooks (SenePay, etc.) and SSE which don't send an Origin from a browser
    if ($request_uri ~* ^/api/ipn) {
        set $allowed_origin 1;
    }
    
    # Allow requests without Origin (direct access) but you could set it to 0 for maximum security
    if ($http_origin = "") {
        set $allowed_origin 1;
    }

    # Proxy to Node.js server
    location / {
        if ($allowed_origin = 0) {
            return 403;
        }

        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Static files caching with security check
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        if ($allowed_origin = 0) {
            return 403;
        }
        
        proxy_pass http://localhost:4000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
